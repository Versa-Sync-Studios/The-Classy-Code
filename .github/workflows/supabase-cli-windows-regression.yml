name: Supabase CLI Windows Credential Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-credential-check:
    name: Check beta credential reads on Windows
    runs-on: windows-latest

    steps:
      - name: Validate secret
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEST }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOKEN)) {
            throw "Missing repository secret SUPABASE_ACCESS_TOKEN_TEST."
          }

      - name: Install beta CLI package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm view supabase dist-tags
          npx supabase@beta --version

      - name: Test beta persisted credential behavior
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEST }}
        run: |
          "## Supabase CLI beta Windows credential test" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY

          $version = npx supabase@beta --version
          "Beta version: $version" >> $env:GITHUB_STEP_SUMMARY

          "### Login with beta" >> $env:GITHUB_STEP_SUMMARY
          npx supabase@beta login --token $env:TOKEN --name supabase
          $login = $LASTEXITCODE
          "beta login exit code: $login" >> $env:GITHUB_STEP_SUMMARY

          "### Credential Manager entries" >> $env:GITHUB_STEP_SUMMARY
          "``````txt" >> $env:GITHUB_STEP_SUMMARY
          cmdkey /list | findstr /i "Supabase" >> $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY

          "### beta projects list" >> $env:GITHUB_STEP_SUMMARY
          npx supabase@beta projects list
          $list = $LASTEXITCODE
          "beta projects list exit code: $list" >> $env:GITHUB_STEP_SUMMARY

          "### beta projects list with explicit profile" >> $env:GITHUB_STEP_SUMMARY
          npx supabase@beta --profile supabase projects list
          $listProfile = $LASTEXITCODE
          "beta explicit profile exit code: $listProfile" >> $env:GITHUB_STEP_SUMMARY

          "" >> $env:GITHUB_STEP_SUMMARY
          "### Result" >> $env:GITHUB_STEP_SUMMARY

          if ($list -eq 0 -or $listProfile -eq 0) {
            "Beta can read the persisted credential." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          "Beta still cannot read the persisted credential." >> $env:GITHUB_STEP_SUMMARY
          throw "Beta credential read failed."
